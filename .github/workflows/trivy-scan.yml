name: Trivy Image Scan

on:
  pull_request:
    types: [opened, reopened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Build image and run Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: espaciox:${{ github.sha }}

      - name: Run Trivy scan (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: espaciox:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload full Trivy JSON report
        if: always()
        run: |
          trivy image --severity CRITICAL,HIGH --format json -o trivy-report.json espaciox:${{ github.sha }} || true
          echo "Trivy report saved to trivy-report.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
