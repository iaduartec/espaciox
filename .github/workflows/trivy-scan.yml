name: Trivy Scan

permissions:
  contents: read
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  trivy:
    name: Run Trivy and upload report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@v1.3.0
      with:
        format: json
        output: trivy-report.json
        severity: CRITICAL,HIGH,MEDIUM

    - name: Upload Trivy JSON report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-report.json

    - name: Comment PR with Trivy summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('trivy-report.json')) return;
          const data = JSON.parse(fs.readFileSync('trivy-report.json','utf8'));
          const vulns = [];
          (data.Results || []).forEach(r => {
            if (r.Vulnerabilities) r.Vulnerabilities.forEach(v => {
              if (['CRITICAL','HIGH','MEDIUM'].includes(v.Severity)) vulns.push(v);
            });
          });
          const total = vulns.length;
          const md = [
            '**Trivy scan results**',
            `Total findings (CRITICAL/HIGH/MEDIUM): **${total}**`,
          ];
          ['CRITICAL','HIGH','MEDIUM'].forEach(s => {
            const c = vulns.filter(v => v.Severity === s).length;
            if (c) md.push(`- **${s}**: ${c}`);
          });
          if (total > 0) {
            md.push('');
            md.push('Top findings:');
            vulns.slice(0,10).forEach(v => {
              md.push(`- **${v.Severity}** ${v.VulnerabilityID} — ${v.Title || v.Description || ''} (${v.InstalledVersion || '<none>'})`);
            });
          } else {
            md.push('');
            md.push('No findings.');
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: md.join('\n')
          });

  trivy-image:
    name: Build image and run Trivy (container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: trivy
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        tags: espaciox:${{ github.sha }}

    - name: Run Trivy image scan and save JSON
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --severity CRITICAL,HIGH,MEDIUM --format json -o trivy-image-report.json espaciox:${{ github.sha }} || true

    - name: Upload Trivy image report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report-${{ github.sha }}
        path: trivy-image-report.json

