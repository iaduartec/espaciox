name: Trivy Image Scan

on:
  pull_request:
    types: [opened, reopened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Build image and run Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: espaciox:${{ github.sha }}

      - name: Run Trivy scan (CRITICAL,HIGH,MEDIUM) via container
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --severity CRITICAL,HIGH,MEDIUM --format table espaciox:${{ github.sha }} || exit_code=$?; echo "TRIVY_EXIT=$exit_code"; if [ "${exit_code:-0}" -ne 0 ]; then exit $exit_code; fi

      - name: Save full Trivy JSON report
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --severity CRITICAL,HIGH,MEDIUM --format json -o trivy-report.json espaciox:${{ github.sha }} || true

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
