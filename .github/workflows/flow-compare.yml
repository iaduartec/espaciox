name: Flow Compare

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

jobs:
  run-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/flow-espaciox.mjs
      - run: node scripts/compare-flow.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: flow-report
          path: |
            flow-report-espaciox.html
            flow-result-espaciox.json
